<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- StudyHub app icon (#349, Concept A "The Transcript"): waveform bars resolve into text
       lines — the build pipeline as a mark. Navy tile so the icon reads on light AND dark tabs;
       one gold end-point = the app's «earned» semantic (same as آية/حديث + stars). -->
  <rect width="64" height="64" rx="14" fill="#141a2e"/>
  <g fill="#8fa0f4">
    <rect x="10" y="22" width="6" height="20" rx="3"/>
    <rect x="20" y="14" width="6" height="36" rx="3"/>
  </g>
  <g fill="#eef0fb">
    <rect x="32" y="20" width="22" height="6" rx="3"/>
    <rect x="32" y="31" width="22" height="6" rx="3"/>
    <rect x="32" y="42" width="15" height="6" rx="3"/>
  </g>
  <circle cx="51.5" cy="45" r="3.5" fill="#c9a54a"/>
</svg>
